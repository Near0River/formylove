<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Secret Gift 🔐</title>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
<style>
* {
box-sizing: border-box;
margin: 0;
padding: 0;
}
body {
font-family: 'Poppins', sans-serif;
background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #e3f2fd 100%);
min-height: 100vh;
display: flex;
justify-content: center;
align-items: center;
padding: 20px;
color: #0d1b2a;
}
.card-wrapper {
position: relative;
z-index: 10;
max-width: 560px;
width: 100%;
padding: 4px;
border-radius: 28px;
background: linear-gradient(135deg, #a8e6cf, #f8bbd0, #1b263b);
box-shadow: 0 15px 35px rgba(13, 27, 42, 0.15);
}
.card {
background: #ffffff;
border-radius: 24px;
padding: 40px 30px;
text-align: center;
}
h1 {
font-family: 'Sacramento', cursive;
font-size: 3.2rem;
color: #0d1b2a;
margin-bottom: 8px;
}
p.subtitle {
font-size: 0.95rem;
color: #3d2314;
margin-bottom: 25px;
font-style: italic;
}
.open-input {
width: 100%;
padding: 16px 20px;
font-size: 1.05rem;
font-family: 'Poppins', sans-serif;
border: 2px solid #2e7d32;
border-radius: 16px;
outline: none;
background: #fcfcfc;
color: #0d1b2a;
margin-bottom: 16px;
}
.open-input:focus {
border-color: #3d2314;
background: #ffffff;
}
.btn-submit {
background: #3d2314;
color: #ffffff;
border: none;
padding: 16px 22px;
font-size: 1.05rem;
font-weight: 600;
border-radius: 16px;
cursor: pointer;
transition: all 0.3s ease;
width: 100%;
font-family: 'Poppins', sans-serif;
}
.btn-submit:hover {
opacity: 0.9;
transform: translateY(-2px);
}
.error-msg {
color: #c62828;
font-size: 0.9rem;
margin-top: 10px;
font-weight: 600;
}
.hidden { display: none !important; }
.letter-text {
font-size: 0.95rem;
line-height: 1.6;
color: #2b2b2b;
text-align: left;
white-space: pre-line;
margin-bottom: 25px;
padding: 18px;
background: #fafafa;
border-radius: 16px;
border: 1px solid #f8bbd0;
}
.voice-box {
background: #fce4ec;
border-radius: 16px;
padding: 20px;
margin-bottom: 25px;
}
.voice-box p {
font-size: 0.9rem;
color: #3d2314;
margin-bottom: 12px;
font-weight: 600;
}
audio {
width: 100%;
}
.btn-back {
display: inline-block;
background: #3d2314;
color: #ffffff;
padding: 14px 28px;
font-size: 1rem;
font-weight: 600;
border-radius: 16px;
text-decoration: none;
transition: all 0.3s ease;
margin-top: 10px;
}
.btn-back:hover {
opacity: 0.9;
transform: translateY(-2px);
}
</style>
</head>
<body>
<div class="card-wrapper">
<div class="card">
<!-- SCHERMATA DI BLOCCO -->
<div id="lockView">
<h1>??? 🔐</h1>
<p class="subtitle">This isn't just any question... it's something you've already discovered somewhere else 💭</p>
<input type="text" id="passInput" class="open-input" placeholder="What did you discover?" onkeypress="handleKeyPress(event)">
<button type="button" class="btn-submit" onclick="checkPassword()">Unlock ❤️</button>
<div id="errorMsg" class="error-msg hidden">That's not it... 🥺</div>
</div>
<!-- CONTENUTO SBLOCCATO -->
<div id="secretContent" class="hidden">
<h1>My Last Secret For You 💖</h1>
<p class="subtitle">You made it this far... this one's just for you.</p>

<!-- PLACEHOLDER: replace with the final letter text -->
<div class="letter-text">[PLACEHOLDER — insert the final letter text here]</div>

<!-- PLACEHOLDER: replace "src" with the voice message audio file -->
<div class="voice-box">
<p>🎙️ A voice message just for you</p>
<audio controls>
<source src="PLACEHOLDER-insert-audio-file-here.mp3" type="audio/mpeg">
Your browser does not support the audio element.
</audio>
</div>

<a href="index.html" class="btn-back">⬅️ Back to Gifts</a>
</div>
</div>
</div>
<script>
// Stesso meccanismo di index.html: hash SHA-256 della risposta attesa.
// Risposta attesa: "2 months" (normalizzata in minuscolo/trim)
const SECRET_HASH = "0672bd18f6c547755e759cfce672a655e115d99c4a5c771415dc4e86e3f9e0e8";

async function sha256(text) {
const enc = new TextEncoder().encode(text);
const buf = await crypto.subtle.digest("SHA-256", enc);
return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
}

async function checkPassword() {
const inputVal = document.getElementById("passInput").value.trim().toLowerCase();
const hash = await sha256(inputVal);
if (hash === SECRET_HASH) {
document.getElementById("lockView").classList.add("hidden");
document.getElementById("secretContent").classList.remove("hidden");
} else {
document.getElementById("errorMsg").classList.remove("hidden");
}
}

function handleKeyPress(event) {
if (event.key === "Enter") {
checkPassword();
}
}
</script>
</body>
</html>
