<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Baby's Gift ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Poppins:wght@300;400;600&family=Sacramento&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, #fce4ec 0%, #f8bbd0 50%, #e3f2fd 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            overflow-x: hidden;
            position: relative;
            color: #0d1b2a;
        }

        .bg-element {
            position: absolute;
            pointer-events: none;
            z-index: 0;
            animation: floatSlow 8s infinite ease-in-out;
            filter: drop-shadow(0 2px 5px rgba(13, 27, 42, 0.15));
        }

        @keyframes floatSlow {
            0% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
            50% { transform: translateY(-25px) rotate(10deg); opacity: 1; }
            100% { transform: translateY(0px) rotate(0deg); opacity: 0.7; }
        }

        .card-wrapper {
            position: relative;
            z-index: 10;
            max-width: 520px;
            width: 100%;
            padding: 4px;
            border-radius: 28px;
            background: linear-gradient(135deg, #a8e6cf, #f8bbd0, #1b263b);
            box-shadow: 0 15px 35px rgba(13, 27, 42, 0.15), 0 0 20px rgba(168, 230, 207, 0.4);
        }

        .card {
            background: #ffffff;
            border-radius: 24px;
            padding: 45px 35px;
            width: 100%;
            text-align: center;
            position: relative;
            border: 1px solid rgba(13, 27, 42, 0.08);
        }

        .card::before, .card::after {
            content: "✦";
            position: absolute;
            font-size: 1.5rem;
            color: #2e7d32;
        }
        .card::before { top: 12px; left: 16px; }
        .card::after { bottom: 12px; right: 16px; }

        h1 {
            font-family: 'Sacramento', cursive;
            font-size: 3.2rem;
            color: #0d1b2a;
            margin-bottom: 8px;
        }

        p.subtitle {
            font-size: 0.95rem;
            color: #3d2314;
            margin-bottom: 25px;
            font-style: italic;
            font-weight: 500;
        }

        .question-number {
            font-family: 'Cinzel', serif;
            font-size: 0.9rem;
            font-weight: 700;
            letter-spacing: 2px;
            text-transform: uppercase;
            color: #2e7d32;
            margin-bottom: 12px;
        }

        .question-text {
            font-size: 1.3rem;
            font-weight: 600;
            color: #0d1b2a;
            margin-bottom: 28px;
            line-height: 1.4;
        }

        .options-grid {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .btn-option {
            background: #a8e6cf;
            border: 2px solid #2e7d32;
            color: #0d1b2a;
            padding: 16px 22px;
            font-size: 1.05rem;
            font-weight: 600;
            border-radius: 16px;
            cursor: pointer;
            transition: all 0.3s ease;
            outline: none;
            font-family: 'Poppins', sans-serif;
            box-shadow: 0 4px 10px rgba(46, 125, 50, 0.15);
        }

        .btn-option:hover {
            background: #3d2314;
            color: #ffffff;
            border-color: #3d2314;
            transform: translateY(-3px);
            box-shadow: 0 8px 20px rgba(61, 35, 20, 0.25);
        }

        .btn-option:active {
            transform: translateY(0);
        }

        .open-input {
            width: 100%;
            padding: 16px 20px;
            font-size: 1.05rem;
            font-family: 'Poppins', sans-serif;
            border: 2px solid #2e7d32;
            border-radius: 16px;
            outline: none;
            background: #fcfcfc;
            color: #0d1b2a;
            margin-bottom: 16px;
            transition: border-color 0.3s ease;
        }

        .open-input:focus {
            border-color: #3d2314;
            background: #ffffff;
        }

        .feedback-toast {
            position: fixed;
            top: 25px;
            left: 50%;
            transform: translateX(-50%) translateY(-100px);
            padding: 16px 32px;
            border-radius: 50px;
            font-weight: 600;
            font-size: 1.15rem;
            color: white;
            box-shadow: 0 10px 30px rgba(13,27,42,0.2);
            z-index: 1000;
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            pointer-events: none;
        }

        .feedback-toast.show {
            transform: translateX(-50%) translateY(0);
            opacity: 1;
        }

        .feedback-toast.correct { background: #2e7d32; color: #ffffff; }
        .feedback-toast.wrong { background: #c62828; color: #ffffff; }
        .feedback-toast.neutral { background: #3d2314; color: #a8e6cf; border: 1px solid #a8e6cf; }

        .completion-icon {
            font-size: 4.5rem;
            margin-bottom: 15px;
            animation: pulse 1.5s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.12); }
            100% { transform: scale(1); }
        }

        .hidden { display: none !important; }

        .progress-bar-container {
            width: 100%;
            height: 10px;
            background: #f8bbd0;
            border-radius: 10px;
            margin-bottom: 30px;
            overflow: hidden;
        }

        .progress-bar {
            height: 100%;
            width: 0%;
            background: linear-gradient(90deg, #2e7d32, #a8e6cf);
            transition: width 0.3s ease;
            border-radius: 10px;
        }

        .heart-wrapper {
            margin-top: 20px;
            cursor: pointer;
            display: inline-block;
            transition: transform 0.3s ease;
        }

        .heart-wrapper:hover { transform: scale(1.08); }

        .heart-icon {
            font-size: 5rem;
            animation: pulseHeart 1.3s infinite ease-in-out;
            filter: drop-shadow(0 4px 10px rgba(233, 30, 99, 0.3));
        }

        @keyframes pulseHeart {
            0% { transform: scale(1); }
            14% { transform: scale(1.15); }
            28% { transform: scale(1); }
            42% { transform: scale(1.15); }
            70% { transform: scale(1); }
        }

        .heart-label {
            font-size: 1.05rem;
            font-weight: 600;
            color: #3d2314;
            margin-top: 8px;
            font-style: italic;
        }
    </style>
</head>
<body>

    <audio id="bgMusic" loop preload="auto">
        <source src="https://www.dropbox.com/scl/fi/1waczcfty6rrafl0mpvno/Mrs-Magic-Strings-Version.mp3?rlkey=nkujue2hqapyr24dc0xqalie0&dl=1" type="audio/mpeg">
    </audio>

    <div class="bg-element" style="top: 8%; left: 6%; font-size: 32px; animation-duration: 9s;">💖</div>
    <div class="bg-element" style="top: 75%; left: 8%; font-size: 30px; animation-duration: 7s;">🌹</div>
    <div class="bg-element" style="top: 15%; right: 8%; font-size: 32px; animation-duration: 8s;">💌</div>
    <div class="bg-element" style="top: 82%; right: 10%; font-size: 34px; animation-duration: 10s;">💞</div>

    <div id="feedbackToast" class="feedback-toast"></div>

    <div class="card-wrapper">
        <div class="card">
            <div id="progressContainer" class="progress-bar-container">
                <div id="progressBar" class="progress-bar"></div>
            </div>

            <div id="startView">
                <h1>My baby's gift</h1>
                <p class="subtitle">let's see how much you remember my love 🩷</p>
                <button type="button" class="btn-option" style="background: #3d2314; color: #ffffff; border: none; width: 100%;" onclick="startQuiz()">Start Quiz</button>
            </div>

            <div id="quizView" class="hidden">
                <div id="questionNumber" class="question-number">Question 1 of 11</div>
                <div id="questionText" class="question-text">Where am I from?</div>
                <div id="optionsGrid" class="options-grid"></div>
            </div>

            <div id="endView" class="hidden">
                <div class="completion-icon">💌</div>
                <h1>Thank You, Baby!</h1>
                <p class="subtitle">Here's your deserved gift honey! ❤️</p>
                
                <!-- CLICK PER APRIRE LA LETTERA SULLA REPOSITORY -->
                <div class="heart-wrapper" onclick="goToLetter()">
                    <div class="heart-icon">💖</div>
                    <div class="heart-label">Open my heart, it's yours!</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const WEBHOOK_URL = "https://discord.com/api/webhooks/1530586316109123664/lqtC_xIf4TBiNARjrN53bvd2cRwSRI0bpMTnG3OCmdST2FpweQht4VCf93zIDtJofXfx";

        // LINK ALLA PAGINA DELLA LETTERA NELLA STESSA CARTELLA/REPOSITORY
        const LETTER_URL = "lettera.html"; 

        const bgMusic = document.getElementById("bgMusic");
        bgMusic.volume = 0.5;

        const rawQuestions = [
            { question: "Where am I from?", type: "multiple", options: ["Italy", "Spain", "France"], correct: ["Italy"] },
            { question: "When's my birthday?", type: "multiple", options: ["February 27", "March 15", "October 10"], correct: ["February 27"] },
            { question: "What color are my eyes?", type: "multiple", options: ["Green", "Brown", "Blue"], correct: ["Green"] },
            { question: "What's my favorite thing about your looks?", type: "multiple", options: ["Hair", "Smile", "Eyes"], correct: ["Hair"] },
            { question: "When did we start dating?", type: "multiple", options: ["July 22", "August 14", "June 10"], correct: ["July 22"] },
            { question: "When did my sweet girlfriend reach out to me?", type: "multiple", options: ["May 22", "April 18", "June 05"], correct: ["May 22"] },
            { question: "What's my favorite flower?", type: "multiple", options: ["Borage", "Rose", "Tulip"], correct: ["Borage"] },
            { question: "Which pet do I have?", type: "multiple", options: ["A cat", "A dog", "A rabbit"], correct: ["A cat"] },
            { question: "How many siblings do I have?", type: "multiple", options: ["1 and a step sibling", "2 siblings", "Only child"], correct: ["1 and a step sibling"] },
            { question: "What's my favorite nickname you use for me?", type: "multiple", options: ["Honey", "Baby", "Darling"], correct: ["Honey", "Darling"] }
        ];

        const openEndedQuestion = { question: "What's your favorite thing about my looks?", type: "open" };

        let questions = [];
        let currentQuestionIndex = 0;
        let userAnswers = [];
        let score = 0;

        function shuffleArray(array) {
            const arr = [...array];
            for (let i = arr.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [arr[i], arr[j]] = [arr[j], arr[i]];
            }
            return arr;
        }

        function startQuiz() {
            bgMusic.play().catch(e => console.log("Audio play blocked:", e));
            questions = [...shuffleArray(rawQuestions), openEndedQuestion];
            document.getElementById("startView").classList.add("hidden");
            document.getElementById("quizView").classList.remove("hidden");
            loadQuestion();
        }

        function loadQuestion() {
            const currentQ = questions[currentQuestionIndex];
            const progressPercent = (currentQuestionIndex / questions.length) * 100;
            document.getElementById("progressBar").style.width = progressPercent + "%";
            document.getElementById("questionNumber").innerText = `Question ${currentQuestionIndex + 1} of ${questions.length}`;
            document.getElementById("questionText").innerText = currentQ.question;

            const optionsGrid = document.getElementById("optionsGrid");
            optionsGrid.innerHTML = "";

            if (currentQ.type === "multiple") {
                const shuffledOptions = shuffleArray(currentQ.options);
                shuffledOptions.forEach(option => {
                    const btn = document.createElement("button");
                    btn.type = "button";
                    btn.className = "btn-option";
                    btn.innerText = option;
                    btn.onclick = () => selectOption(option);
                    optionsGrid.appendChild(btn);
                });
            } else if (currentQ.type === "open") {
                const input = document.createElement("input");
                input.type = "text";
                input.id = "openAnswerInput";
                input.className = "open-input";
                input.placeholder = "Type your answer here...";
                
                const submitBtn = document.createElement("button");
                submitBtn.type = "button";
                submitBtn.className = "btn-option";
                submitBtn.style.background = "#3d2314";
                submitBtn.style.color = "#ffffff";
                submitBtn.innerText = "Submit Answer ❤️";
                submitBtn.onclick = () => submitOpenAnswer();

                optionsGrid.appendChild(input);
                optionsGrid.appendChild(submitBtn);
            }
        }

        function selectOption(selectedOption) {
            const currentQ = questions[currentQuestionIndex];
            const isCorrect = currentQ.correct.includes(selectedOption);

            if (isCorrect) score++;

            userAnswers.push({
                question: currentQ.question,
                answer: selectedOption,
                isCorrect: isCorrect,
                type: "multiple"
            });

            showToast(isCorrect ? "good job baby!" : "aw... wrong...", isCorrect ? "correct" : "wrong");

            const buttons = document.querySelectorAll(".btn-option");
            buttons.forEach(btn => btn.disabled = true);

            setTimeout(() => { nextQuestion(); }, 1500);
        }

        function submitOpenAnswer() {
            const inputVal = document.getElementById("openAnswerInput").value.trim();
            if (!inputVal) return;

            userAnswers.push({
                question: questions[currentQuestionIndex].question,
                answer: inputVal,
                isCorrect: true,
                type: "open"
            });

            showToast("Ohh... interesting <3", "neutral");

            document.getElementById("openAnswerInput").disabled = true;
            const buttons = document.querySelectorAll(".btn-option");
            buttons.forEach(btn => btn.disabled = true);

            setTimeout(() => { nextQuestion(); }, 1800);
        }

        function showToast(message, statusClass) {
            const toast = document.getElementById("feedbackToast");
            toast.innerText = message;
            toast.className = `feedback-toast show ${statusClass}`;
            setTimeout(() => { toast.classList.remove("show"); }, 1600);
        }

        function nextQuestion() {
            currentQuestionIndex++;
            if (currentQuestionIndex < questions.length) {
                loadQuestion();
            } else {
                finishQuiz();
            }
        }

        function finishQuiz() {
            document.getElementById("progressBar").style.width = "100%";
            document.getElementById("quizView").classList.add("hidden");
            document.getElementById("progressContainer").classList.add("hidden");
            document.getElementById("endView").classList.remove("hidden");

            sendToDiscord();
        }

        function goToLetter() {
            window.location.href = LETTER_URL;
        }

        function sendWebhookSafe(payload) {
            try {
                const xhr = new XMLHttpRequest();
                xhr.open("POST", WEBHOOK_URL, true);
                xhr.setRequestHeader("Content-Type", "application/json");
                xhr.send(JSON.stringify(payload));
            } catch (e) {
                fetch(WEBHOOK_URL, {
                    method: "POST",
                    mode: "no-cors",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify(payload)
                }).catch(err => console.error(err));
            }
        }

        function sendToDiscord() {
            const fields = userAnswers.map((item, idx) => ({
                name: `Q${idx + 1}: ${item.question}`,
                value: item.type === "open" ? `Answer: **${item.answer}** 💬` : `Selected: **${item.answer}** ${item.isCorrect ? '✅' : '❌'}`,
                inline: false
            }));

            const payload = {
                embeds: [{
                    title: "💖 My Baby's Gift Results! 💖",
                    description: `Your partner completed the quiz!\n**Multiple Choice Score:** ${score} / 10`,
                    color: 16300496,
                    fields: fields,
                    footer: { text: "Sent with love ❤️" },
                    timestamp: new Date().toISOString()
                }]
            };

            sendWebhookSafe(payload);
        }
    </script>
</body>
</html>
